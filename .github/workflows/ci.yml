name: ci

# Reusable CI for BLB3DPrinting repositories.
# Called from each repo's own .github/workflows/ci.yml via `uses:`.
#
# Runs on both Linux and Windows. Aeonyx and the agent hooks run on Windows in
# production; FilaOps ships to Linux. Path handling differs between them
# (case folding, separators), so a test that is green on one says nothing
# about the other. The org ruleset requires both matrix legs:
#   "ci / ci (ubuntu-latest)" and "ci / ci (windows-latest)".
#
# Actions are pinned to commit SHAs; Dependabot (github-actions ecosystem)
# opens PRs to bump them. Callers reference this workflow at @main, which is
# acceptable because main on this repo is protected by the org ruleset
# (PR + review required, no bypass actors).

on:
  workflow_call:
    inputs:
      python-version:
        description: Python version to test with
        type: string
        default: "3.12"
      working-directory:
        description: Directory containing pyproject.toml or requirements*.txt
        type: string
        default: "."
      run-tests:
        description: Run pytest (set false for repos with no tests yet)
        type: boolean
        default: true
      run-lint:
        description: Run ruff
        type: boolean
        default: true
      os:
        description: JSON array of runner labels for the matrix
        type: string
        default: '["ubuntu-latest", "windows-latest"]'

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.os) }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
        shell: bash
    steps:
      - name: Checkout (full history for secret scan)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Secret scan (gitleaks)
        # Linux only: Windows runners have no Docker. One scan of the history is enough.
        if: runner.os == 'Linux'
        run: |
          docker run --rm -v "${{ github.workspace }}:/repo:ro" \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            detect --source /repo --no-banner --redact --exit-code 1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f pyproject.toml ]; then
            pip install -e ".[dev]" 2>/dev/null || pip install -e .
          fi
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          pip install ruff pytest

      - name: Lint (ruff)
        if: ${{ inputs.run-lint }}
        run: ruff check .

      - name: Tests (pytest)
        if: ${{ inputs.run-tests }}
        run: python -m pytest -q
