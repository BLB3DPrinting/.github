name: ci

# Reusable CI for BLB3DPrinting repositories.
# Called from each repo's own .github/workflows/ci.yml via `uses:`.
# The job is named `ci` on purpose: the required status check in the
# org ruleset is the context "ci / ci" (caller job / reusable job).

on:
  workflow_call:
    inputs:
      python-version:
        description: Python version to test with
        type: string
        default: "3.12"
      working-directory:
        description: Directory containing pyproject.toml or requirements*.txt
        type: string
        default: "."
      run-tests:
        description: Run pytest (set false for repos with no tests yet)
        type: boolean
        default: true
      run-lint:
        description: Run ruff
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Checkout (full history for secret scan)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret scan (gitleaks)
        # Runs the gitleaks container directly; no license or action required.
        run: |
          docker run --rm -v "${{ github.workspace }}:/repo" \
            ghcr.io/gitleaks/gitleaks:latest \
            detect --source /repo --no-banner --redact --exit-code 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f pyproject.toml ]; then
            pip install -e ".[dev]" 2>/dev/null || pip install -e .
          fi
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          pip install ruff pytest

      - name: Lint (ruff)
        if: ${{ inputs.run-lint }}
        run: ruff check .

      - name: Tests (pytest)
        if: ${{ inputs.run-tests }}
        run: python -m pytest -q
